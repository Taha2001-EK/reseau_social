security:
    # On définit comment on hache les mots de passe (automatique)
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # On définit où on trouve les utilisateurs (Dans MongoDB)
    providers:
        app_user_provider:
            mongodb:
                class: App\Document\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            
            # AJOUTE CETTE LIGNE :
            entry_point: form_login

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            
            logout:
                path: app_logout

    # On protègera les pages ici plus tard
    access_control:
        # - { path: ^/admin, roles: ROLE_ADMIN }